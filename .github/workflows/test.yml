name: オフラインユニットテスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: uv と Python をセットアップ
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: false
          checksum: '23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8'

      - name: ロック済み依存をインストール
        run: uv sync --locked --no-dev

      - name: 外部送信なしでテスト
        run: uv run --locked --no-dev python -m unittest discover -s tests -v
